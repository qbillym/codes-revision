<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <link rel="stylesheet" href="form.css" />
</head>
<body>
  <form id="my-form">      
    <h2>Registration Form</h2>
    
    <label for="name">Full Name:</label>
    <input type="text" id="name" placeholder="Enter your full name" />

    <label for="address">Address:</label>
    <input type="text" id="address" placeholder="Enter your address" />

    <label for="email">Email Address:</label>
    <input type="email" id="email" placeholder="Enter your email" />

    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter password (min 6 characters)" />

    <label for="confirm-password">Confirm Password:</label>
    <input type="password" id="confirm" placeholder="Confirm your password" />

    <label for="select">Country:</label>
    <select id="select">
      <option value="" disabled selected>Select your country</option>
      <option value="RWANDA">Rwanda</option>
      <option value="UGANDA">Uganda</option>
      <option value="KENYA">Kenya</option>
      <option value="TANZANIA">Tanzania</option>
    </select>

    <label for="college">College Name:</label>
    <textarea cols="20" rows="3" id="college" placeholder="Enter your college name"></textarea>

    <label class="checkbox-label">
      <input type="checkbox" id="check" />
      I agree to the terms and conditions
    </label>

    <div class="button-group">
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </div>
  </form>

  <script src="form.js"></script>
</body>
</html>
